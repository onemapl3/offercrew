# 目标公司清单的示例（模板）。你自己的清单是本机文件 config/companies.yaml（不进仓库）：
# 没有它时系统读这份示例；bin/discover.mjs、bin/verify-sources.mjs 第一次回写就会建出本机文件。
# 每种适配器（lib/ats/*.mjs 的 ats_type）保留一家知名公司作为示例，字段与适配器一一对应；照同样结构增删。
# status / job_count / verified_at 等字段由 `node bin/discover.mjs --retry-unverified` 与 `node bin/verify-sources.mjs` 回写；
# 加 `paused: <原因>` 可暂停某个来源。
