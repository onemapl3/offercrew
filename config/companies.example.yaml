  hq: 待核
  cn_offices:
  - Shanghai
  ats_type: ashby
  board: airwallex
  careers_url: https://jobs.ashbyhq.com/airwallex
  status: verified
  careers_http_status: 200
  why: 示例：ashby 适配器（lib/ats/ashby.mjs）的写法
