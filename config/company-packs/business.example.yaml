# 职能与管培公司包（起步清单）：快消、汽车、零售餐饮的管培生和职能岗，外加大厂。
# 给「人力 / 行政」「市场」「销售 / 商务」「项目管理」四个方向用。
#
# 这是起步清单，不会自动被扫描：把你想要的那几段复制到 config/companies.yaml（你自己的公司清单，本机文件），
# 下一轮 node bin/discover.mjs 才会去读。写法和 config/companies.yaml 完全一样，多出来的三项：
#   group    分组：fmcg 快消 · auto 汽车 · retail 零售和餐饮 · big_tech 大厂
#   presets  这家公司招哪些方向的人：hr_admin 人力 / 行政 · marketing 市场 · sales 销售 / 商务 · project_management 项目管理
#   why      为什么在包里、核对时读到了什么
#
# 每一家都在 2026-10-02 用现有适配器只读核过（沙盒、演示数据，先看 robots.txt 放行再读）。
# 数字的口径：社招、校招、实习三类都读，只数落在北京、上海、深圳、广州、杭州、香港六个城市里的岗位；
# Workday 上的外企按国家筛，数的是筛完的全部。平时扫描按你的阶段和城市来，数目会不一样。
# 大厂没有写 queries：按你的方向自动换搜索词（市场、销售、HRBP、项目经理……，lib/directions.mjs）。
# 核对时四个方向的词各取几个一起搜（市场、品牌、营销、销售、大客户、商务拓展、招聘、HRBP、人力资源、行政、
# 项目经理、PMO），每个词翻两页；只选一个方向时读到的会少一些。
# 读不到、或者还没有适配器的公司列在文件最后，不在包里。

