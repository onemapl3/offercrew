# 会计公司包（起步清单）：四大、内资会计师事务所、大厂的财务岗。给「会计」方向用。
#
# 这是起步清单，不会自动被扫描：把你想要的那几段复制到 config/companies.yaml（你自己的公司清单，本机文件），
# 下一轮 node bin/discover.mjs 才会去读。写法和 config/companies.yaml 完全一样，多出来的三项：
#   group    分组：big4 四大 · cn_cpa_firm 内资所 · corporate_finance 企业财务（大厂等）
#   presets  这家公司招哪些方向的人：accounting 会计
#   why      为什么在包里、核对时读到了什么
#
# 每一家都在 2026-10-02 用现有适配器只读核过（沙盒、演示数据，先看 robots.txt 放行再读）。
# 数字的口径：社招、校招、实习三类都读，只数落在北京、上海、深圳、广州、杭州、香港六个城市里的岗位。
# 平时扫描按你的阶段和城市来：在读的读实习和校招，应届的读校招和社招，有经验的只读社招，数目会不一样。
# 大厂没有写 queries：按你的会计细分自动换搜索词（审计、会计、税务、财务分析……，lib/directions.mjs），
# 核对时用的就是这一串，每个词翻两页。
# 读不到、或者还没有适配器的机构列在文件最后，不在包里。

