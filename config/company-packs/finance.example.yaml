# 金融公司包（起步清单）：国内券商、基金、银行、保险，外资投行和银行、精品投行、买方。给「金融」方向用。
#
# 这是起步清单，不会自动被扫描：把你想要的那几段复制到 config/companies.yaml（你自己的公司清单，本机文件），
# 下一轮 node bin/discover.mjs 才会去读。写法和 config/companies.yaml 完全一样，多出来的三项：
#   group    分组：cn_broker 券商 · cn_fund 基金 · cn_bank 银行 · cn_insurance 保险 · global_bank 外资投行和银行
#            · boutique 精品投行 · buy_side 买方
#   presets  这家公司招哪些方向的人：finance 金融
#   why      为什么在包里、核对时读到了什么
#
# 每一家都在 2026-10-02 用现有适配器只读核过（沙盒、演示数据，先看 robots.txt 放行再读；Workday 用
# node bin/robots-check.mjs 按站点核）。数字的口径：
#   国内门户（北森、Moka、大易、飞书）社招、校招、实习三类都读，只数落在北京、上海、深圳、广州、杭州、香港六个城市里的；
#   外资（Workday、Oracle、Greenhouse、Oleeo）数的是这个站点的全部，括号里是纽约、香港、中国大陆的。
# 平时扫描按你的阶段和城市来：在读的读实习和校招，应届的读校招和社招，有经验的只读社招，数目会不一样。
# 目标城市是香港、上海的人，外资能读到的不多，主力是国内机构；目标在纽约的，外资这块基本够用。
# 一家公司的社招、校招在两个站上的，分成两条（名字后面写「（校招）」）。
# 读不到、或者还没有适配器的机构列在文件最后，不在包里。

