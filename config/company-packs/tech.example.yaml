# 科技公司包（起步清单）：国内大厂、大模型公司、外企在华研发、海外远程。
#
# 这是起步清单，不会自动被扫描：把你想要的那几段复制到 config/companies.yaml（你自己的公司清单，本机文件），
# 下一轮 node bin/discover.mjs 才会去读。写法和 config/companies.yaml 完全一样，多出来的三项：
#   group    分组：cn_big_tech 国内大厂 · ai_lab 大模型公司 · foreign_rnd 外企在华研发 · overseas_remote 海外远程
#   presets  这家公司招哪些方向的人：engineering 工程 · product 产品 · data 数据 · design 设计 · operations 运营
#            （同一批科技公司也招产品、数据、设计、运营；国内门户按你的求职方向自动换搜索词，lib/ats/cn.mjs）
#   why      为什么在包里、核对时读到了什么
#
# 每一家都在 2026-09-29 用现有适配器实际读到过岗位：node bin/discover.mjs --company <名字> --dry-run（只读）。
# 国内门户核对时只搜了一个词、翻了一页，岗位数是那一次读到的、落在目标城市（北京、上海、杭州、深圳）里的；
# 平时扫描按你的方向和城市来，数目会不一样。Workday 上的外企用 query: China 只看中国的岗位。
# 读不到、或者还没有适配器的公司列在文件最后，不在包里。

