# 法律公司包（起步清单）：内资律所、外所在华办公室、公司法务和合规岗（大厂、金融机构）。给「法律」方向用。
#
# 这是起步清单，不会自动被扫描：把你想要的那几段复制到 config/companies.yaml（你自己的公司清单，本机文件），
# 下一轮 node bin/discover.mjs 才会去读。写法和 config/companies.yaml 完全一样，多出来的三项：
#   group    分组：cn_law_firm 内资所 · intl_law_firm 外所 · in_house 公司法务和合规（大厂、外资银行等）
#   presets  这家公司招哪些方向的人：legal 法律
#   why      为什么在包里、核对时读到了什么
#
# 每一家都在 2026-10-02 用现有适配器只读核过（沙盒、演示数据，先看 robots.txt 放行再读）。
# 数字的口径：国内门户社招、校招、实习三类都读，只数落在北京、上海、深圳、广州、杭州、香港六个城市里的岗位；
# Workday 上的外所和外资机构数的是全球，括号里是香港、北京、上海的。平时扫描按你的阶段和城市来，数目会不一样。
# 大厂一家的法务、合规岗就比任何一家律所多，所以公司法务和律所并列。大厂没有写 queries：按你的法律细分自动换
# 搜索词（法务、律师、法律顾问、合规……，lib/directions.mjs），核对时用的就是这一串，每个词翻两页。
# 金融机构在北森上的用 keywords（北森的关键词是模糊匹配，会带出不相干的岗位，判断时再按标题筛）。
# 读不到、或者还没有适配器的机构列在文件最后，不在包里。

